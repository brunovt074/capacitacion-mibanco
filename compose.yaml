name: capacitacion-mibanco

services:
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    read_only: true
    mem_limit: 64m
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./media:/srv/media:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - easypanel
    labels:
      traefik.enable: "true"
      traefik.docker.network: easypanel
      traefik.http.routers.capacitacion-mibanco.rule: Host(`capacitacion-mibanco.72-60-247-32.sslip.io`)
      traefik.http.routers.capacitacion-mibanco.entrypoints: https
      traefik.http.routers.capacitacion-mibanco.tls: "true"
      traefik.http.routers.capacitacion-mibanco.tls.certresolver: letsencrypt
      traefik.http.services.capacitacion-mibanco.loadbalancer.server.port: "80"

networks:
  easypanel:
    external: true
